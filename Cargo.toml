[package]
authors = ["Nelson Chen <nelson@mindflakes.com>"]
description = "Speedtest.net testing utility and crate"
exclude = ["tests/config/*"]
license = "MIT OR Apache-2.0"
name = "speedtest-rs"
repository = "https://github.com/nelsonjchen/speedtest-rs"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4.45"
env_logger = "0.11.11"
log = {  version = "0.4.33", optional = true }
url = "2.5.8"
mockito = "1.7.2"
md5 = "0.8.1"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
roxmltree = "0.21.1"
rayon = "1.12.0"
iter-read = "1.1.0"

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["blocking", "native-tls"]

[features]
rustls-tls = ["reqwest/rustls"]
log = ["dep:log"]
