on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

name: Usage Demo

jobs:
  usage-demo:
    name: Usage Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run (Typical)
        run: cargo run

      - name: Run (CSV Output)
        run: cargo run -- --csv

      - name: Run (CSV HEADER)
        run: cargo run -- --
